# Phase 2 Pipeline Settings
# Tanzania Agricultural Annual Sample Survey (AASS) 2024/2025 (Catalog 69)

raw_data_dir: "data/AASS 2024_2025"
faostat_data_dir: "data/FAOSTAT"

output_dirs:
  audit: "phase2_data/outputs/audit"
  cleaned_data: "phase2_data/outputs/cleaned_data"
  analytical_data: "phase2_data/outputs/analytical_data"
  diagnostics: "phase2_data/outputs/diagnostics"
  reports: "phase2_data/outputs/reports"

sample_parameters:
  holding_type_smallholder: 2.0  # 1.0 = Commercial Large Scale, 2.0 = Household Smallholder
  max_smallholder_land_ha: 5.0   # Agronomic threshold for standard smallholder cohort (can flag > 5 ha)
  min_plot_area_ha: 0.001        # Minimum plausible plot area (10 m2)
  max_plot_area_ha: 50.0         # Plausible single smallholder plot maximum

priority_food_crops:
  - "Maize"
  - "Paddy"
  - "Beans"
  - "Cassava"
  - "Sorghum"
  - "Sweet Potatoes"
  - "Groundnuts"

# Agronomic plausible yield bounds in kg/ha based on FAO / MoA Tanzania agronomic baselines
agronomic_yield_bounds_kg_ha:
  Maize:
    min: 50.0
    max: 8000.0
    fao_national_mean: 1650.0
  Paddy:
    min: 50.0
    max: 9000.0
    fao_national_mean: 2300.0
  Beans:
    min: 30.0
    max: 4000.0
    fao_national_mean: 850.0
  Cassava:
    min: 100.0
    max: 30000.0  # Fresh root equivalent
    fao_national_mean: 8500.0
  Sorghum:
    min: 30.0
    max: 5000.0
    fao_national_mean: 1100.0
  Sweet Potatoes:
    min: 100.0
    max: 25000.0
    fao_national_mean: 7500.0
  Groundnuts:
    min: 30.0
    max: 4000.0
    fao_national_mean: 900.0
  default:
    min: 20.0
    max: 15000.0

volatility_parameters:
  epsilon: 1.0e-6
  legacy_epsilon: 1.0e-4

random_seed: 42
